<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Usman Khan — Visual Artist</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #050505;
            --card-bg: #111111;
            --accent: #00d2ff;
            --text: #ffffff;
            --muted: #888888;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ANIMATED BG GRID */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,210,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,210,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0%   { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* GLOW BLOBS */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 { width: 500px; height: 500px; background: var(--accent); top: -100px; left: -100px; animation: blobFloat 8s ease-in-out infinite; }
        .blob-2 { width: 400px; height: 400px; background: #0066ff; bottom: -100px; right: -100px; animation: blobFloat 10s ease-in-out infinite reverse; }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            50%       { transform: translate(30px,30px) scale(1.1); }
        }

        /* NAV */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(5,5,5,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; color: var(--text); text-transform: uppercase; text-decoration: none; }
        .logo span { color: var(--accent); }
        .back-btn {
            display: flex; align-items: center; gap: 8px;
            color: var(--muted); text-decoration: none;
            font-weight: 600; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s; padding: 8px 16px;
            border: 1px solid var(--border); border-radius: 6px;
        }
        .back-btn:hover { color: var(--accent); border-color: var(--accent); }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 5%;
            position: relative;
            z-index: 1;
        }

        .wrap { text-align: center; max-width: 600px; }

        /* ICON */
        .uc-icon {
            width: 90px; height: 90px;
            background: rgba(0,210,255,0.08);
            border: 2px solid rgba(0,210,255,0.2);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px;
            font-size: 2.2rem; color: var(--accent);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,210,255,0); }
            50%       { box-shadow: 0 0 0 18px rgba(0,210,255,0.07); }
        }

        /* BADGE */
        .badge {
            display: inline-block;
            background: rgba(255,160,0,0.1);
            border: 1px solid rgba(255,160,0,0.3);
            color: #ffa500;
            font-size: 0.7rem; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase;
            padding: 6px 18px; border-radius: 50px;
            margin-bottom: 22px;
            animation: fadeInUp 0.5s ease both;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 900; line-height: 1.1;
            margin-bottom: 16px;
            animation: fadeInUp 0.6s ease 0.1s both;
        }
        h1 span { color: var(--accent); }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        /* PROGRESS BAR */
        .progress-wrap {
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease 0.3s both;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #0066ff);
            border-radius: 10px;
            animation: fillBar 2s ease 0.8s forwards;
        }
        @keyframes fillBar {
            to { width: 35%; }
        }

        /* SECTIONS PREVIEW */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease 0.4s both;
        }
        .sec-chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            transition: 0.3s;
        }
        .sec-chip i { display: block; font-size: 1.1rem; color: rgba(0,210,255,0.4); margin-bottom: 6px; }
        .sec-chip:hover { border-color: rgba(0,210,255,0.3); color: var(--text); }

        /* BACK BUTTON */
        .back-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #000;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            animation: fadeInUp 0.6s ease 0.5s both;
        }
        .back-cta:hover { box-shadow: 0 0 24px rgba(0,210,255,0.4); transform: translateY(-3px); }

        footer {
            position: relative; z-index: 1;
            text-align: center; padding: 24px;
            color: var(--muted); font-size: 0.76rem;
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--accent); text-decoration: none; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .sections-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<nav>
    <a href="index.html" class="logo">Visual <span>Artist</span></a>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
</nav>

<div class="main">
    <div class="wrap">

        <div class="badge">🚧 Under Construction</div>

        <h1>Page is Being<br><span>Built.</span></h1>

        <!-- PROGRESS -->
        <div class="progress-wrap">
            <div class="progress-label">
                <span>Work in progress</span>
                <span>35%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- SECTIONS PREVIEW -->
        <div class="sections-grid">
            <div class="sec-chip"><i class="fas fa-ad"></i>Social Ads</div>
            <div class="sec-chip"><i class="fas fa-sliders-h"></i>Before/After</div>
            <div class="sec-chip"><i class="fas fa-mobile-alt"></i>Reels</div>
            <div class="sec-chip"><i class="fas fa-film"></i>Long-form</div>
            <div class="sec-chip"><i class="fas fa-microphone"></i>Podcast</div>
            <div class="sec-chip"><i class="fas fa-calendar-alt"></i>Events</div>
            <div class="sec-chip"><i class="fas fa-broadcast-tower"></i>Live</div>
            <div class="sec-chip"><i class="fas fa-ellipsis-h"></i>More...</div>
        </div>

        <a href="index.html" class="back-cta">
            <i class="fas fa-arrow-left"></i> Home
        </a>

    </div>
</div>

<footer>
    © 2025 Usman Khan — Visual Artist &nbsp;·&nbsp; <a href="index.html">← Home</a>
</footer>

</body>
</html>
