<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | Usman Khan — Visual Artist</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #050505;
            --card-bg: #111111;
            --accent: #00d2ff;
            --text: #ffffff;
            --muted: #888888;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ANIMATED BG GRID */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,210,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,210,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0%   { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* GLOW BLOBS */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 { width: 500px; height: 500px; background: var(--accent); top: -100px; left: -100px; animation: blobFloat 8s ease-in-out infinite; }
        .blob-2 { width: 400px; height: 400px; background: #0066ff; bottom: -100px; right: -100px; animation: blobFloat 10s ease-in-out infinite reverse; }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            50%       { transform: translate(30px,30px) scale(1.1); }
        }

        /* NAV */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(5,5,5,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; color: var(--text); text-transform: uppercase; text-decoration: none; }
        .logo span { color: var(--accent); }
        .back-btn {
            display: flex; align-items: center; gap: 8px;
            color: var(--muted); text-decoration: none;
            font-weight: 600; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s; padding: 8px 16px;
            border: 1px solid var(--border); border-radius: 6px;
        }
        .back-btn:hover { color: var(--accent); border-color: var(--accent); }

        /* MAIN CONTENT */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 5%;
            position: relative;
            z-index: 1;
        }

        .coming-soon-wrap { text-align: center; max-width: 680px; }

        /* BADGE */
        .badge {
            display: inline-block;
            background: rgba(0,210,255,0.1);
            border: 1px solid rgba(0,210,255,0.25);
            color: var(--accent);
            font-size: 0.7rem; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase;
            padding: 6px 18px; border-radius: 50px;
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease both;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 900; line-height: 1.05;
            margin-bottom: 40px;
            animation: fadeInUp 0.7s ease 0.1s both;
        }
        h1 span { color: var(--accent); }

        /* SOCIAL LINKS */
        .social-links {
            display: flex; justify-content: center; gap: 12px;
            animation: fadeInUp 0.7s ease 0.3s both;
        }
        .social-link {
            display: flex; align-items: center; gap: 7px;
            padding: 10px 18px; border-radius: 8px;
            text-decoration: none; font-weight: 700;
            font-size: 0.8rem; transition: 0.3s;
            border: 1px solid var(--border); color: var(--muted);
        }
        .social-link:hover { color: var(--accent); border-color: var(--accent); }

        /* FOOTER */
        footer {
            position: relative; z-index: 1;
            text-align: center; padding: 24px;
            color: var(--muted); font-size: 0.76rem;
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--accent); text-decoration: none; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>



<!-- BLOBS -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- NAV -->
<nav>
    <a href="index.html" class="logo">Visual <span>Artist</span></a>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
</nav>

<!-- MAIN -->
<div class="main">
    <div class="coming-soon-wrap">

        <div class="badge">🚀 Launching Soon</div>

        <h1>Something<br><span>Big</span> is Coming.</h1>

        <!-- SOCIAL -->
        <div class="social-links">
            <a href="https://wa.me/923072969303" target="_blank" class="social-link">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
            <a href="https://www.linkedin.com/in/usmankhan07/" target="_blank" class="social-link">
                <i class="fab fa-linkedin"></i> LinkedIn
            </a>

        </div>

    </div>
</div>

<!-- FOOTER -->
<footer>
    © 2025 Usman Khan — Visual Artist &nbsp;·&nbsp; <a href="index.html">← Back to Portfolio</a>
</footer>

</body>
</html>
